name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unit tests + debug APK
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log || {
            msg=$(grep -E -A12 "^e: |issues were found|AAPT|error:|What went wrong|FAILED" build.log | head -90 | tr '\n' '|')
            echo "::error::${msg:0:3500}"
            exit 1
          }
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk focus-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Focus build ${{ github.run_number }}
          files: focus-${{ github.run_number }}.apk
